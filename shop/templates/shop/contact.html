{% extends 'shop/base.html' %}
{% load crispy_forms_tags %}

{% block title %}Contact Us - Online Shop{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card">
            <div class="card-header">
                <h3 class="card-title mb-0">Contact Us</h3>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Send Message</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="mt-4">
            <h5>Other Ways to Reach Us</h5>
            <div class="row">
                <div class="col-sm-6">
                    <div class="card">
                        <div class="card-body text-center">
                            <i class="fas fa-phone fa-2x text-primary mb-2"></i>
                            <h6>Phone</h6>
                            <p class="mb-0">+ (995) 599 99 99 99</p>
                        </div>
                    </div>
                </div>
                <div class="col-sm-6">
                    <div class="card">
                        <div class="card-body text-center">
                            <i class="fas fa-envelope fa-2x text-primary mb-2"></i>
                            <h6>Email</h6>
                            <p class="mb-0">support@onlineshop.com</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
